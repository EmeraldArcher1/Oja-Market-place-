name: Free quality checks

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Check authentication invariants
        run: npm run check:auth
      - name: Run automated tests
        run: npm test
      - name: Run lint
        run: npm run lint
